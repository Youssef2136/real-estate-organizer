<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALKAZAZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cinzel:wght@700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cinzel:wght@700&display=swap"></noscript>
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#0f172a;--mut:#64748b;--line:rgba(15,23,42,.1);--main:#C9A050;--gold-dark:#8a6a1f;--wa:#25D366;--danger:#e5484d;--sand:rgba(15,23,42,.06);--tr:.4s cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;font-size:16px;line-height:1.7;padding-bottom:40px;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
@keyframes fadeUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
header{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:.7rem 1rem;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(15,23,42,.08);color:var(--ink)}
header h1{margin:0;font-family:Cinzel,'Playfair Display',Georgia,serif;font-size:1.45rem;font-weight:700;letter-spacing:.08em;line-height:1.15}
.brand{flex:1;min-width:0}
.brand small{display:block;font-size:.65rem;color:var(--mut);letter-spacing:.03em;margin-top:1px;font-weight:600}
#cur{font-size:.85rem;color:var(--gold-dark);font-weight:700;background:rgba(201,160,80,.15);border:1px solid rgba(201,160,80,.35);padding:.2rem .9rem;border-radius:100px}
#menuBtn{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#f1f5f9;border:1px solid rgba(15,23,42,.1);color:var(--ink);cursor:pointer;padding:0;transition:all var(--tr)}
#menuBtn:hover{background:#e2e8f0}
#menuBtn svg{width:20px;height:20px}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;z-index:20}
#ov.on{display:block}
#drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(290px,82vw);background:rgba(255,255,255,.98);border-inline-end:1px solid rgba(15,23,42,.08);z-index:21;transform:translateX(100%);transition:transform var(--tr);padding:18px 12px;box-shadow:rgba(15,23,42,.25) 0 20px 40px}
#drawer.on{transform:none}
.tab{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:#334155;font:inherit;font-weight:700;padding:.65rem 1rem;border-radius:100px;cursor:pointer;text-align:start;margin-bottom:4px;transition:all var(--tr)}
.tab:hover{background:rgba(15,23,42,.06);color:var(--ink)}
.tab.on{background:linear-gradient(135deg,#C9A050,#E0BC6B);color:#0a0f1e;box-shadow:rgba(201,160,80,.5) 0 8px 20px -8px}
.tab span{background:rgba(15,23,42,.08);border-radius:20px;padding:1px 10px;font-size:13px}
.tab.on span{background:rgba(10,15,30,.18)}
main{max-width:900px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;margin-bottom:14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid rgba(15,23,42,.15);border-radius:14px;padding:9px 14px;transition:all var(--tr)}
input::placeholder,textarea::placeholder{color:#94a3b8}
select option{background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px rgba(201,160,80,.22)}
button:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.btn{border:0;border-radius:100px;font:inherit;font-weight:700;font-size:14.5px;padding:8px 14px;cursor:pointer;background:linear-gradient(135deg,#C9A050,#E0BC6B);color:#0a0f1e;box-shadow:rgba(201,160,80,.45) 0 10px 22px -8px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:all var(--tr)}
.btn:hover{transform:translateY(-3px)}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
.ic.wa{fill:currentColor;stroke:none}
.btn .ic{font-size:.95em;transition:transform var(--tr)}
.btn:hover .ic{transform:translateX(3px) scale(1.12)}
.btn.gray{background:#f1f5f9;border:1px solid rgba(15,23,42,.12);color:var(--ink);box-shadow:none}
.btn.gray:hover{background:#e2e8f0}
.btn.wa{background:var(--wa);color:#fff;box-shadow:rgba(37,211,102,.4) 0 10px 22px -8px}
.btn.call{background:#0ea5e9;color:#fff;box-shadow:rgba(14,165,233,.4) 0 10px 22px -8px}
.btn.red{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.4);color:#c62828;box-shadow:none}
.btn.red:hover{background:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid rgba(15,23,42,.08);border-radius:1.8rem;padding:1.2rem;margin-bottom:14px;box-shadow:rgba(15,23,42,.18) 0 12px 30px -18px;transition:all var(--tr);animation:fadeUp .8s ease both}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(to right,#C9A050,#E0BC6B);transform:scaleX(0);transition:transform var(--tr)}
.card:hover{transform:translateY(-8px);background:#fffdf7}
.card:hover::before{transform:scaleX(1)}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.fi svg{width:24px;height:24px;display:block}
.fi{flex:none;width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,#1e293b,#0f172a);display:grid;place-items:center;font-size:1.2rem;color:#E0BC6B;transition:all var(--tr)}
.card:hover .fi{background:var(--main);color:#0a0f1e;transform:translateX(3px)}
.card h3{margin:0 0 2px;font-size:1.15rem;font-weight:800}
.sub{color:var(--mut);font-size:.85rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.phone{direction:ltr;font-weight:700;letter-spacing:.3px;color:var(--gold-dark)}
.details{white-space:pre-wrap;margin:8px 0;line-height:1.7;color:#334155}
.ph{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.ph::-webkit-scrollbar{display:none}
.ph img{height:84px;width:112px;object-fit:cover;border-radius:1rem;cursor:pointer;flex:none;border:1px solid var(--line);transition:transform .8s}
.ph img:hover{transform:scale(1.08)}
.tag{display:inline-flex;align-items:center;gap:.4rem;background:rgba(201,160,80,.12);border:1px solid rgba(201,160,80,.35);color:var(--gold-dark);border-radius:100px;padding:.15rem .8rem;font-size:.8rem;margin-inline-end:6px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;border-top:1px dashed rgba(15,23,42,.15);padding-top:12px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
dialog{border:1px solid rgba(15,23,42,.1);border-radius:2rem;background:#fff;color:var(--ink);width:min(560px,94vw);padding:20px;max-height:92vh;box-shadow:rgba(15,23,42,.35) 0 20px 40px -10px}
dialog::backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(4px)}
label{display:block;font-weight:700;margin:12px 0 5px;font-size:.85rem;color:#334155}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pv div{position:relative}
.pv img{height:70px;width:92px;object-fit:cover;border-radius:.8rem}
.pv button{position:absolute;top:-6px;inset-inline-start:-6px;border:0;background:var(--danger);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer}
.foot{display:flex;gap:8px;margin-top:18px}
.foot .btn{flex:1}
.tools{display:flex;gap:8px;justify-content:center;margin-top:24px;flex-wrap:wrap}
#big{max-width:100%;max-height:74vh;border-radius:1.2rem;display:block;margin:auto;object-fit:contain;touch-action:pan-y}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(15,23,42,.55);color:#fff;font-size:14px;cursor:pointer;opacity:.85;transition:all var(--tr)}
.nav:hover{opacity:1;background:var(--main);color:#0a0f1e}
#bk{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;overflow:hidden;border:0;border-radius:0;background:#fff}
#bk iframe{width:100%;height:100%;border:0;display:block}
#splash{position:fixed;inset:0;z-index:9999;background:#060B14;transition:opacity .6s ease}
#splash img{width:100%;height:100%;object-fit:cover;display:block}
#splash::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to top,rgba(4,10,22,.62),rgba(4,10,22,0));pointer-events:none}
#splashText{position:absolute;z-index:2;left:0;right:0;bottom:21%;text-align:center;padding:0 12px;font-family:Cinzel,'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(.95rem,4.8vw,1.6rem);letter-spacing:.04em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.65),0 0 28px rgba(201,160,80,.45);white-space:nowrap}
#splashText .ln{min-height:1.35em;line-height:1.35}
#splashText .ln{font-family:Cinzel,'Playfair Display',Georgia,serif;font-weight:700;font-style:normal}
#splashText #sl2{font-size:1.3em;letter-spacing:.22em;color:#E0BC6B;margin-top:2px}
#splashText .cur{display:inline-block;width:2px;height:1.05em;margin-inline-start:4px;background:#E0BC6B;vertical-align:-.15em;animation:curBlink .6s steps(1) infinite}
@keyframes curBlink{50%{opacity:0}}
#authGate{position:fixed;inset:0;z-index:10001;background:rgba(7,12,22,.92);display:grid;place-items:center;padding:18px;backdrop-filter:blur(8px)}
#authGate[hidden]{display:none}
.auth-card{width:min(420px,100%);background:#fff;border:1px solid rgba(201,160,80,.45);border-radius:26px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.auth-card h2{margin:0;color:#8a6a1f;font-family:Cinzel,Georgia,serif;text-align:center;letter-spacing:.08em;font-size:1.8rem}
.auth-card p{margin:6px 0 18px;color:#64748b;text-align:center}
.auth-card .btn{width:100%;margin-top:16px}
.auth-actions{display:flex;justify-content:center;margin-top:10px}
.auth-actions button{border:0;background:none;color:#8a6a1f;text-decoration:underline;cursor:pointer;font:inherit}
#authMessage{min-height:24px;margin-top:10px;text-align:center;color:#64748b;font-size:.88rem}
#logoutBtn{padding:5px 10px;font-size:12px}
</style>
</head>

const EMB={clients:'clSrc'};
function userDoc(collection,id){
  if(!auth.currentUser) throw new Error('لازم تسجل الدخول الأول');
  return doc(db,'users',auth.currentUser.uid,collection,id);
}
async function cloudRead(collection,id,fallback){
  const snap=await getDoc(userDoc(collection,id));
  return snap.exists()?snap.data():fallback;
}
async function cloudWrite(collection,id,value){
  await setDoc(userDoc(collection,id),value);
}
async function load(){return await cloudRead('appData','main',null)}
async function save(){
  try{await cloudWrite('appData','main',S);return true}
  catch(e){console.error('Firestore save failed',e);alert('تعذر الحفظ على Firebase. راجع اتصال الإنترنت وقواعد الأمان.');return false}
}

function pvSrc(p){return typeof p==='string'?p:(p.preview||p.url||'')}
function drawPv(){$('pv').innerHTML=tmpPhotos.map((p,i)=>`<div><img src="${pvSrc(p)}" alt=""><button type="button" data-x="${i}">×</button></div>`).join('')}
async function canvasBlob(file,maxDim,quality){
  const bmp=await createImageBitmap(file);const scale=Math.min(1,maxDim/Math.max(bmp.width,bmp.height));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close&&bmp.close();
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('تعذر ضغط الصورة')),'image/jpeg',quality));
}
async function readOrig(file){return file.size<=900*1024?file:await canvasBlob(file,2200,.9)}
async function shrink(file){return await canvasBlob(file,1000,.8)}
async function uploadPhoto(item,recordId,kind,index){
  if(typeof item==='string')return {url:item,path:null};
  if(item&&item.url)return {url:item.url,path:item.path||null};
  if(!item||!item.blob)throw new Error('صورة غير صالحة');
  const mime=item.blob.type||'image/jpeg',ext=mime.includes('png')?'png':'jpg';
  const path=`users/${currentUser.uid}/chalet-photos/${recordId}/${kind}-${index}-${Date.now()}.${ext}`;
  const fileRef=ref(storage,path);await uploadBytes(fileRef,item.blob,{contentType:mime});
  const url=await getDownloadURL(fileRef);return {url,path};
}
function revokePreview(item){if(item&&item.preview&&item.preview.startsWith('blob:'))URL.revokeObjectURL(item.preview)}

const v=id=>$(id).value.trim();
async function submit(){
  if(tab==='notes'){
    if(!v('f_title')&&!v('f_text')){$('f_text').focus();return}
    let remind='';
    if($('f_rem').checked){
      remind=$('f_remAt').value;
      if(!remind){$('f_remAt').focus();return}
      if(new Date(remind)<=new Date()){alert('اختار موعد في المستقبل');return}
      unlockAudio();if('Notification' in window&&Notification.permission==='default')try{Notification.requestPermission()}catch(_){}
    }
    const rec={title:v('f_title'),text:v('f_text'),remind,fired:false};
    if(editing){const i=S.notes.findIndex(x=>x.id===editing);S.notes[i]={...S.notes[i],...rec}}else S.notes.unshift({id:uid(),date:new Date().toLocaleDateString('ar-EG'),...rec});
    await save();$('dlg').close();render();return;
  }
  if(!v('f_name')){$('f_name').focus();return}
  let rec;
  const arr=tab==='owners'?S.owners:S.clients;
  const oldRecord=editing?arr.find(x=>x.id===editing):null;
  const recordId=editing||uid();
  try{
    const [photoItems,origItems]=await Promise.all([
      Promise.all(tmpPhotos.map((p,i)=>uploadPhoto(p,recordId,'preview',i))),
      Promise.all(tmpOrigs.map((p,i)=>uploadPhoto(p,recordId,'original',i)))
    ]);
    rec={name:v('f_name'),...($('f_phone')?{phone:v('f_phone')}:{}),chalet:v('f_chalet'),location:v('f_location'),rooms:v('f_rooms'),price:v('f_price'),details:v('f_details'),photos:photoItems.map(x=>x.url),photoPaths:photoItems.map(x=>x.path),origs:origItems.map(x=>x.url),origPaths:origItems.map(x=>x.path)};
    if(tab!=='owners')rec.type=tab;
    rec.map=v('f_map');
    if(editing){const i=arr.findIndex(x=>x.id===editing);arr[i]={...arr[i],...rec}}else arr.unshift({id:recordId,...rec});
    const ok=await save();
    if(!ok)throw new Error('لم يتم حفظ بيانات الشاليه');
    const keep=new Set([...rec.photoPaths,...rec.origPaths].filter(Boolean));
    const removed=[...(oldRecord?.photoPaths||[]),...(oldRecord?.origPaths||[])].filter(p=>p&&!keep.has(p));
    for(const path of removed){try{await deleteObject(ref(storage,path))}catch(_){}}
    tmpPhotos.forEach(revokePreview);tmpOrigs.forEach(revokePreview);
    $('dlg').close();render();
  }catch(err){alert('تعذر حفظ الشاليه أو رفع الصور على Firebase: '+(err.message||err));}
}

/* ---------- Secure same-origin bridge for the embedded mini-apps ---------- */
window.addEventListener('message',async ev=>{
  const d=ev.data;if(!d||d.type!=='alkazaz-cloud-request'||!d.requestId)return;
  const clientFrame=$('chFrame'),bookingFrame=$('bkFrame');
  const fromClients=!!(clientFrame&&ev.source===clientFrame.contentWindow);
  const fromBookings=!!(bookingFrame&&ev.source===bookingFrame.contentWindow);
  if(!fromClients&&!fromBookings)return;
  try{
    let result=null;
    if(fromClients&&d.action==='clients:get'){
      result=await cloudRead('appData','clientDirectory',{clients:[],fixedMessage:''});
      clientDirectory={clients:Array.isArray(result.clients)?result.clients:[],fixedMessage:result.fixedMessage||''};
    }else if(fromClients&&d.action==='clients:set'){
      const payload={clients:Array.isArray(d.clients)?d.clients:[],fixedMessage:String(d.fixedMessage||'')};
      await cloudWrite('appData','clientDirectory',payload);clientDirectory=payload;result={saved:true};

async function photoToFile(source,name){
  if(String(source).startsWith('data:')){
    const i=source.indexOf(','),head=source.slice(0,i),bin=atob(source.slice(i+1));
    const mime=(head.match(/:(.*?)[;,]/)||[])[1]||'image/jpeg';
    const arr=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
    return new File([arr],name+'.'+(mime.split('/')[1]||'jpeg').replace('jpeg','jpg'),{type:mime});
  }
  const response=await fetch(source);if(!response.ok)throw new Error('تعذر تنزيل الصورة من Firebase');
  const blob=await response.blob();const ext=(blob.type.split('/')[1]||'jpeg').replace('jpeg','jpg');
  return new File([blob],name+'.'+ext,{type:blob.type||'image/jpeg'});
}

async function dropTrashData(t){
  if(t.kind==='chalet'){
    try{await deleteDoc(userDoc('chaletBookings',t.data.id))}catch(e){console.warn('booking document cleanup failed',e)}
    const paths=[...(t.data.photoPaths||[]),...(t.data.origPaths||[])].filter(Boolean);

async function purgeTrash(){
  if(!S.trash||!S.trash.length)return;
  const now=Date.now(),keep=[];let changed=false;
  for(const t of S.trash){if(now-t.deletedAt>=TRASH_DAYS*DAY_MS){await dropTrashData(t);changed=true}else keep.push(t)}
  if(changed){S.trash=keep;await save();if(tab==='trash')render()}

async function trashRestore(tid){
  const t=(S.trash||[]).find(x=>x.tid===tid);if(!t)return;
  if(t.kind==='chalet'){const arr=t.data.type?S.clients:S.owners;if(!arr.some(x=>x.id===t.data.id))arr.unshift(t.data)}
  else if(t.kind==='note'){if(!S.notes.some(x=>x.id===t.data.id))S.notes.unshift(t.data)}
  else if(t.kind==='client'){
    const d=await cloudRead('appData','clientDirectory',{clients:[],fixedMessage:''});
    d.clients=Array.isArray(d.clients)?d.clients:[];
    if(!d.clients.some(x=>x.id===t.data.id))d.clients.unshift(t.data);

async function shareBatch(batches,i,text,all){

  const payload=i===0&&navigator.canShare({files,text})?{files,text}:{files};

let audioCtx=null,beepT=null,ringT2=null,ringId=null;
const pad=n=>String(n).padStart(2,'0');
const fmtRem=r=>new Date(r).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});
const toLocalInput=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}
function ringBurst(dur){
  if(!audioCtx)return;
  try{
    const t=audioCtx.currentTime,g=audioCtx.createGain();g.gain.value=.14;
    const lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();lfo.frequency.value=20;lg.gain.value=.14;lfo.connect(lg);lg.connect(g.gain);
    [440,480].forEach(f=>{const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+dur)});
    lfo.start(t);lfo.stop(t+dur);g.connect(audioCtx.destination);
  }catch(e){}
}
function startRing(){stopRing();unlockAudio();const cycle=()=>{ringBurst(.9);clearTimeout(ringT2);ringT2=setTimeout(()=>ringBurst(.9),1100);try{navigator.vibrate&&navigator.vibrate([900,200,900])}catch(e){}};cycle();beepT=setInterval(cycle,3200)}
async function notifyDevice(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const opt={body,requireInteraction:true,vibrate:[400,200,400,200,400],tag:'re-reminder',renotify:true};
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg&&reg.showNotification){await reg.showNotification(title,opt);return}}catch(e){}
  try{const n=new Notification(title,opt);n.onclick=()=>{window.focus();n.close()}}catch(e){}
}
function stopRing(){clearInterval(beepT);clearTimeout(ringT2);beepT=null}
function checkReminders(){

  else if(t.dataset.o){const o=S.owners.concat(S.clients).find(x=>x.id===t.dataset.o);vList=o.photos.map((p,i)=>(o.origs&&o.origs[i])||p);vIdx=+t.dataset.i;showV();$('viewer').showModal()}
});
const layers=[];let ignoreBack=0,drawerLayer=null;
function pushLayer(l){layers.push(l);history.pushState({layer:layers.length},'')}
function layerClosed(l){const i=layers.indexOf(l);if(i<0)return;layers.splice(i,1);ignoreBack++;history.back()}
const _showModal=HTMLDialogElement.prototype.showModal;
HTMLDialogElement.prototype.showModal=function(){_showModal.call(this);if(this.id!=='alarm'&&!layers.includes(this))pushLayer(this)};
document.addEventListener('close',e=>{if(layers.includes(e.target)&&!e.target.open)layerClosed(e.target)},true);
window.addEventListener('popstate',()=>{
  if(ignoreBack>0){ignoreBack--;return}
  const l=layers.pop();if(!l)return;
  if(l===drawerLayer)drawerLayer=null;
  l.close();
});
function toggleMenu(on){
  const d=$('drawer'),o=$('ov');on=on===undefined?!d.classList.contains('on'):on;
  d.classList.toggle('on',on);o.classList.toggle('on',on);
  if(on&&!drawerLayer){drawerLayer={close(){toggleMenu(false)}};pushLayer(drawerLayer)}
  else if(!on&&drawerLayer){const l=drawerLayer;drawerLayer=null;layerClosed(l)}
}
$('addBtn').onclick=()=>openForm();
let qT;$('q').oninput=()=>{clearTimeout(qT);qT=setTimeout(render,150)};
(()=>{const l1=document.getElementById('sl1'),l2=document.getElementById('sl2');if(!l1||!l2)return;const t1='Welcome to ALKAZAZ',t2='Marassi',all=t1.length+t2.length;const cur=document.createElement('i');cur.className='cur';let i=0;const go=()=>{const tm=setInterval(()=>{if(!document.getElementById('splash')){clearInterval(tm);return}i++;const a=Math.min(i,t1.length),b=Math.max(0,i-t1.length);l1.textContent=t1.slice(0,a);l2.textContent=t2.slice(0,b);(i<=t1.length?l1:l2).appendChild(cur);if(i>=all)clearInterval(tm)},52)};let started=false;const run=()=>{if(!started){started=true;go()}};try{Promise.race([document.fonts.load("700 1em Cinzel"),new Promise(r=>setTimeout(r,1200))]).then(run,run)}catch(e){run()}})();
setTimeout(()=>{const s=document.getElementById('splash');if(!s)return;s.style.opacity='0';s.style.pointerEvents='none';setTimeout(()=>s.remove(),700)},3000);
function authMessage(text,isError=false){const el=$('authMessage');if(el){el.textContent=text;el.style.color=isError?'#c62828':'#64748b'}}
function authErrorText(code){
  return ({'auth/invalid-credential':'البريد الإلكتروني أو كلمة المرور غير صحيحة.','auth/user-not-found':'الحساب غير موجود.','auth/wrong-password':'كلمة المرور غير صحيحة.','auth/too-many-requests':'محاولات كثيرة. جرّب بعد قليل.','auth/network-request-failed':'تأكد من اتصال الإنترنت.','auth/invalid-email':'البريد الإلكتروني غير صحيح.'})[code]||'حصل خطأ أثناء الاتصال بـ Firebase. راجع الإعدادات وحاول مرة أخرى.';
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();if(!firebaseReady){authMessage('لازم تضيف بيانات مشروع Firebase في firebase-config.js أولاً.',true);return}
  const btn=$('loginBtn');btn.disabled=true;btn.textContent='جاري تسجيل الدخول…';authMessage('');
  try{await setPersistence(auth,inMemoryPersistence);await signInWithEmailAndPassword(auth,$('loginEmail').value.trim(),$('loginPassword').value)}
  catch(err){authMessage(authErrorText(err.code),true)}finally{btn.disabled=false;btn.textContent='دخول'}
});
$('resetPasswordBtn').addEventListener('click',async()=>{
  if(!firebaseReady){authMessage('إعدادات Firebase غير مكتملة.',true);return}
  const email=$('loginEmail').value.trim();if(!email){authMessage('اكتب البريد الإلكتروني أولاً.',true);return}
  try{await sendPasswordResetEmail(auth,email);authMessage('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك.')}
  catch(err){authMessage(authErrorText(err.code),true)}
});
$('logoutBtn').addEventListener('click',async()=>{try{await signOut(auth)}catch(e){alert('تعذر تسجيل الخروج: '+e.message)}});
async function startUserSession(user){
  currentUser=user;$('authGate').hidden=true;$('logoutBtn').hidden=false;$('cur').textContent='متصل';
  $('list').innerHTML='<div class="empty">جاري تحميل بياناتك من Firebase…</div>';
  try{
    const [remoteMain,remoteClients]=await Promise.all([
      load(),cloudRead('appData','clientDirectory',{clients:[],fixedMessage:''})
    ]);
    S=remoteMain&&remoteMain.owners?{owners:[],clients:[],notes:[],trash:[],...remoteMain}:{owners:[],clients:[],notes:[],trash:[]};
    clientDirectory={clients:Array.isArray(remoteClients.clients)?remoteClients.clients:[],fixedMessage:remoteClients.fixedMessage||''};
    render();checkReminders();await purgeTrash();if(!purgeTimer)purgeTimer=setInterval(purgeTrash,3600e3);
  }catch(err){
    console.error(err);$('list').innerHTML='<div class="empty">تعذر تحميل البيانات من Firebase. راجع قواعد Firestore والاتصال.</div>';alert('تعذر تحميل بيانات الحساب: '+(err.message||err));
  }
}
async function startApp(){
  if(!firebaseReady){authMessage('أضف بيانات مشروع Firebase داخل firebase-config.js ثم ارفع الملفات إلى GitHub.',true);$('loginBtn').disabled=true;return}
  try{await setPersistence(auth,inMemoryPersistence)}catch(e){authMessage('تعذر ضبط جلسة الذاكرة. '+e.message,true);return}
  onAuthStateChanged(auth,async user=>{
    if(user){await startUserSession(user)}else{
      currentUser=null;S={owners:[],clients:[],notes:[],trash:[]};clientDirectory={clients:[],fixedMessage:''};
      $('authGate').hidden=false;$('logoutBtn').hidden=true;$('cur').textContent='';$('list').innerHTML='';
      authMessage('سجّل الدخول للمتابعة.');
    }
  });
}
startApp();
